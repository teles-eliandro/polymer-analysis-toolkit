[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",
    # B008 is a false positive for FastAPI: File(), Form(), Query(), Body()
    # and friends are *meant* to be called in the argument defaults, that is
    # how the framework declares parameters.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
