name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app tests

      - name: Run tests
        working-directory: backend
        run: pytest -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        env:
          CI: "true"
        run: npm test -- --watchAll=false

      - name: Locale accents
        working-directory: frontend
        # Um valor sem acento nao quebra nada: compila, os testes passam, a
        # pagina renderiza "Medias numerica e ponderal". Nenhum teste funcional
        # pega isso, porque o valor continua sendo uma string nao vazia. Só um
        # humano lendo a tela pega -- entao ele tem de ser um portao.
        run: python3 scripts/check_locale_accents.py

      - name: Build
        working-directory: frontend
        env:
          # A placeholder keeps the build from failing when the production
          # URL is not configured in CI; the real value is set in Vercel.
          # It has to name the service that actually exists: this pointed at
          # pat-backend.onrender.com, which is not a Render service. A stale
          # placeholder is invisible until someone copies it into a real env.
          REACT_APP_API_URL: https://polymer-analysis-toolkit.onrender.com
          CI: "false"
        run: npm run build
