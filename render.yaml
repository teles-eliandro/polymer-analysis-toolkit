# Render blueprint for the PAT API.
#
# The previous version of this file pointed the start command at
# `backend.app.main:app` while also setting PYTHONPATH to `backend`. Only one
# of those can be right: with PYTHONPATH=/opt/render/project/src/backend the
# app package is importable as `app`, not as `backend.app`. The service never
# came up. The start command below matches the PYTHONPATH that is set, and is
# the same invocation used locally and in CI.
#
# The `name` below must match the live service, whose URL is
# https://polymer-analysis-toolkit.onrender.com. It previously read
# `pat-backend`, which is a *different* hostname; a Blueprint sync against that
# name would create a second, duplicate service on the account. The frontend
# calls the hostname above, so a divergent name here is a silent trap rather
# than a visible failure. Keep the two in step.

services:
  - type: web
    name: polymer-analysis-toolkit
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      # Comma-separated list of origins allowed to call this API from a
      # browser. Set this to the deployed frontend origin. The pattern for
      # Vercel preview deployments is allowed by the regex in app/main.py.
      - key: PAT_ALLOWED_ORIGINS
        value: https://polymer-analysis-toolkit.vercel.app
